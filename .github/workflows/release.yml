name: Build and Release

# Push a tag like v1.0.1 to build the .exe and publish it as a GitHub release.
# Run it manually from the Actions tab to just build the .exe as a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check the app imports cleanly
        run: python -c "import core, gui"

      - name: Build executable
        run: python build.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesktopLEDSync
          path: dist/DesktopLEDSync.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DesktopLEDSync.exe
          generate_release_notes: true
